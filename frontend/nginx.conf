# Fix #343: 访问日志去掉 query string。SSE 已改用一次性 ticket，但日志里也不该
# 留下任何凭据——默认 combined 格式记录 $request（含 query），这里改用 $uri。
# log_format 只能定义在 http 上下文，而本文件正是被 include 进 http 的。
log_format taskflow_no_query '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status '
                             '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    # Fix #331: 非 root 运行监听 8080（>1024 端口无需特权），compose 映射 80:8080
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log taskflow_no_query;
    # Fix #332: 安全响应头。注意 nginx 的 add_header 继承规则——location 内
    # 出现任何 add_header 时必须重复这些安全头（见 /assets/）。
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：Vue3/Element Plus 需要 inline style；API 同源故 connect-src 'self'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" always;
    # HSTS 仅在启用 TLS 的部署下放开（生产建议）:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由 - Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 Scheduler
    location /api/ {
        proxy_pass http://scheduler:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Fix #141: SSE 日志流代理 — 必须禁用缓冲，否则事件会被 nginx 攒在
    # 缓冲区里，实时日志流将失效。
    location ~ /api/v1/instances/.+/tasks/.+/logs/stream$ {
        proxy_pass http://scheduler:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # 静态资源缓存（location 内重新声明安全头，避免被 Cache-Control 覆盖继承）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" always;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
