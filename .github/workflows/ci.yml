name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-unit-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Catch2 离线包（gitignore 的构建依赖）
        run: |
          mkdir -p backend/deps
          curl -sL -o backend/deps/Catch2-v3.5.2.tar.gz \
            https://github.com/catchorg/Catch2/archive/refs/tags/v3.5.2.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 依赖从源码编译（gRPC/Drogon/protobuf），用 gha 缓存层加速；
      # builder 阶段含编译器与全部开发依赖
      - name: 构建依赖开发镜像（gha 缓存）
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.deps
          target: builder
          tags: taskflow-deps-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 编译
        run: |
          docker run -d --name tfbuild -v "$GITHUB_WORKSPACE/backend:/src" \
            -w /src taskflow-deps-dev:latest sleep infinity
          docker exec tfbuild bash -c "mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON"
          docker exec tfbuild bash -c "cd build && make -j\$(nproc)"

      - name: 单元测试（ctest）
        # ScriptExecutor 系列用例依赖容器内未安装的 python/node/ruby 解释器，排除
        run: docker exec tfbuild bash -c "cd build && ctest -E 'ScriptExecutor' --output-on-failure"

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: frontend
      - name: 构建与类型检查
        run: npm run build
        working-directory: frontend

  compose-smoke:
    name: 全栈冒烟（compose）
    runs-on: ubuntu-latest
    needs: [ backend-unit-tests, frontend-build ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # scheduler/worker 的 Dockerfile FROM taskflow-deps:latest（运行时镜像），
      # 必须先构建它。gha 缓存复用 backend-unit-tests job 的编译层。
      - name: 构建依赖运行时镜像（gha 缓存）
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.deps
          tags: taskflow-deps:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: 构建三个服务镜像（gha 缓存）
        # buildx 的 docker-container driver 不访问本地 docker 镜像库，
        # FROM taskflow-deps:latest 会去远端解析而失败——用
        # --build-context docker-image:// 把 FROM 指向本地已加载的 deps 镜像
        run: |
          docker buildx build --build-context taskflow-deps=docker-image://taskflow-deps:latest \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -f backend/Dockerfile.scheduler -t taskflow-scheduler:latest backend/
          docker buildx build --build-context taskflow-deps=docker-image://taskflow-deps:latest \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --load -f backend/Dockerfile.worker -t taskflow-worker:latest backend/
          docker buildx build --cache-from type=gha --cache-to type=gha,mode=max \
            --load -t taskflow-frontend:latest frontend/

      # 镜像已预构建加载，--no-build 直接使用；-p taskflow 使派生镜像名对齐
      - name: 启动全栈
        run: docker compose -p taskflow up -d --no-build

      - name: 等待就绪
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "scheduler ready"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/api/v1/health

      - name: 冒烟：登录 → 建任务 → 建工作流 → 触发 → 断言 SUCCESS
        run: |
          set -e
          TOKEN=$(curl -s -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['access_token'])")
          AUTH="Authorization: Bearer $TOKEN"

          # worker 应已自动注册上线
          for i in $(seq 1 30); do
            N=$(curl -s http://localhost:8080/api/v1/workers -H "$AUTH" \
              | python3 -c "import sys,json;print(len(json.load(sys.stdin)['data']['items'] or []))")
            [ "${N:-0}" -ge 1 ] && break
            sleep 2
          done
          echo "在线 worker 数: $N"
          [ "${N:-0}" -ge 1 ]

          TASK=$(curl -s -X POST http://localhost:8080/api/v1/tasks -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"ci-smoke-$GITHUB_RUN_ID\",\"type\":\"command\",\"config_json\":{\"command\":\"echo CI-SMOKE-OK\",\"working_dir\":\"/tmp\"}}")
          TID=$(echo "$TASK" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          WF=$(curl -s -X POST http://localhost:8080/api/v1/workflows -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"ci-smoke-wf-$GITHUB_RUN_ID\",\"dag_json\":{\"nodes\":[{\"id\":\"n1\",\"task_id\":\"$TID\"}],\"edges\":[]},\"schedule_strategy\":\"random\"}")
          WID=$(echo "$WF" | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['id'])")
          IID=$(curl -s -X POST "http://localhost:8080/api/v1/workflows/$WID/trigger" -H "$AUTH" \
            -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['instance_id'])")

          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(curl -s "http://localhost:8080/api/v1/instances/$IID" -H "$AUTH" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['status'])")
            echo "  poll#$i $STATUS"
            case "$STATUS" in SUCCESS|FAILED|CANCELLED) break;; esac
            sleep 2
          done
          [ "$STATUS" = "SUCCESS" ] || { echo "冒烟失败: 期望 SUCCESS 实际 $STATUS"; exit 1; }
          echo "冒烟通过"
