version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    image: taskflow-scheduler:latest
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - scheduler-logs:/app/logs
    configs:
      - source: scheduler_config
        target: /app/scheduler.yaml
    # Fix #142: deploy.replicas is ignored in non-swarm docker compose.
    # Multi-scheduler HA requires a load balancer (scheduler binds fixed
    # ports 8080/50051). Use Docker Swarm for true replica scheduling.
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: taskflow-worker:latest
    depends_on:
      - scheduler
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - worker-logs:/app/logs
      - worker-task-logs:/app/logs/tasks
    configs:
      - source: worker_config
        target: /app/worker.yaml
    # Fix #142: deploy.replicas is ignored in non-swarm docker compose.
    # To run multiple workers: docker compose up -d --scale worker=2
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - scheduler
    restart: unless-stopped

configs:
  scheduler_config:
    content: |
      server:
        http_port: 8080
        grpc_port: 50051
        # Fix #326: gRPC 内部认证（与 worker_config 中的一致），生产替换为随机值
        grpc_auth_token: "taskflow-internal-grpc-token-change-me"
      database:
        host: postgres
        port: 5432
        name: taskflow
        user: taskflow
        password: "taskflow123"
        min_connections: 5
        max_connections: 20
      auth:
        jwt_secret: "taskflow-jwt-secret-key-must-be-at-least-32-chars"
        access_token_ttl: 86400
        refresh_token_ttl: 604800
      encryption:
        # Fix #324: 旧默认值为 38 字符，不满足"必须为 32 字符"的启动校验，
        # scheduler 会崩溃循环。生产部署务必替换为随机密钥。
        aes_key: "TaskFlowDefaultAesKey_ChangeMe32"
      log:
        level: info
        file_path: logs/scheduler.log
      schedule:
        dag_drive_interval: 2
        heartbeat_check_interval: 10
        heartbeat_timeout: 30
        timeout_check_interval: 10
        leader_lease_interval: 5

  worker_config:
    content: |
      server:
        grpc_port: 50052
        # Fix #326: 与 scheduler_config 中 server.grpc_auth_token 一致，
        # 同时用于注册/心跳（客户端）与本地 gRPC 服务（服务端校验）
        grpc_auth_token: "taskflow-internal-grpc-token-change-me"
        # Each scaled worker registers its own container IP. The `worker`
        # service name load-balances and cannot identify a specific replica.
        advertise_address: "auto"
      scheduler:
        address: "scheduler:50051"
      worker:
        name: ""
        max_tasks: 10
        resource_tags: []
      log:
        level: info
        file_path: logs/worker.log
      task_log:
        dir: logs/tasks
        retention_days: 30

volumes:
  pgdata:
  scheduler-logs:
  worker-logs:
  worker-task-logs:
